<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Longer or Shorter? — Game Length</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
        },
        colors: {
          iosBg: '#0f172a',
          iosCard: 'rgba(30, 41, 59, 0.75)',
          accent: '#ff5a36',
          good: '#10b981',
          bad: '#ef4444',
        }
      }
    }
  }
</script>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }

  body {
    background-color: #0b0f19;
    color: #f8fafc;
    padding-top: var(--sat);
    padding-bottom: var(--sab);
    padding-left: var(--sal);
    padding-right: var(--sar);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  .glass {
    background: rgba(23, 32, 51, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .glass-card {
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .card-slide-in {
    animation: slideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .correct-pulse {
    animation: pulseGood 0.6s ease-out forwards;
  }

  @keyframes pulseGood {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); border-color: #10b981; }
    70% { box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); border-color: #10b981; }
    100% { border-color: #10b981; }
  }

  .wrong-shake {
    animation: shakeBad 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
  }

  @keyframes shakeBad {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); border-color: #ef4444; }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }

  .poster-skeleton {
    background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
    background-size: 200% 100%;
    animation: skeleton-loading 1.5s infinite;
  }

  @keyframes skeleton-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans antialiased text-slate-100">

  <!-- Header Sticky Bar -->
  <header class="sticky top-0 z-30 w-full glass border-b border-white/10 px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center font-black text-sm shadow-md">
        ⏱️
      </div>
      <h1 class="font-extrabold text-base tracking-tight leading-none bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
        Longer or Shorter
      </h1>
    </div>

    <div class="flex items-center gap-2">
      <div class="bg-slate-800/80 border border-white/10 rounded-full px-3 py-1 flex items-center gap-1.5 text-xs font-bold shadow-inner">
        <span class="text-slate-400 font-medium">Score</span>
        <span id="score" class="text-rose-400 font-extrabold text-sm">0</span>
      </div>
      <div class="bg-slate-800/80 border border-white/10 rounded-full px-3 py-1 flex items-center gap-1.5 text-xs font-bold shadow-inner">
        <span class="text-slate-400 font-medium">Best</span>
        <span id="best" class="text-amber-400 font-extrabold text-sm">0</span>
      </div>
    </div>
  </header>

  <!-- Automatic Loading & Status Screen -->
  <main id="statusContainer" class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto my-auto w-full">
    <div class="glass-card rounded-3xl p-6 shadow-2xl border border-white/10 w-full flex flex-col items-center gap-4">
      <div id="loadingIcon" class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-2xl mb-1">
        <svg class="animate-spin h-6 w-6 text-rose-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>
      <h2 id="statusTitle" class="text-lg font-bold text-white">Loading Dataset...</h2>
      <p id="statusDesc" class="text-xs text-slate-400 leading-relaxed">
        Automatically loading <code class="bg-slate-800 text-rose-300 px-1.5 py-0.5 rounded border border-white/5">hltb.jsonlines</code> from current server directory.
      </p>

      <div id="picker" class="hidden w-full mt-2 flex flex-col gap-3">
        <p class="text-xs text-amber-300/90 bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20 text-left">
          ⚠️ Could not automatically find <code class="text-amber-200">hltb.jsonlines</code>. Select the file manually below if testing locally:
        </p>
        <label for
